# 合并进现有 Mihomo 配置；这是规则片段，不是代理节点订阅。
rule-providers:
  home-adblock:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/MaoLikeQvQ/Home-Adblock-Rules/ed4e5bb7e895fdd1ba472c15d6c9cdf4d0b6188d/clash.yaml
    path: ./ruleset/home-adblock.yaml
    interval: 28800
rules:
  # 白名单已在构建时处理；放在广泛匹配规则和 MATCH 前。
  - RULE-SET,home-adblock,REJECT
