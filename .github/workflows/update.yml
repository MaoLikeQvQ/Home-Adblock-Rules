name: Update subscriptions

on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'licenses/**'
      - '.github/workflows/update.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Read stable baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          stable_status=0
          git ls-remote --exit-code --heads origin dist >/dev/null || stable_status=$?
          if [ "$stable_status" -eq 0 ]; then
            git fetch origin refs/heads/dist:refs/remotes/origin/dist
            mkdir -p .baseline dist
            git archive refs/remotes/origin/dist | tar -x -C .baseline
            cp .baseline/report.json dist/report.json
            echo "commit=$(git rev-parse refs/remotes/origin/dist)" >> "$GITHUB_OUTPUT"
          elif [ "$stable_status" -ne 2 ]; then
            exit 1
          fi
      - name: Build immutable upstream inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build.py
      - name: Analyze policy and stable changes
        shell: bash
        run: |
          set -euo pipefail
          validation_status=0
          python scripts/validate.py --candidate dist --baseline .baseline || validation_status=$?
          if [ "$validation_status" -ne 0 ] && [ "$validation_status" -ne 2 ]; then
            exit "$validation_status"
          fi
      - name: Real Mihomo and AdGuard tests
        run: python scripts/smoke_engines.py --candidate dist
      - name: Seal candidate
        env:
          STABLE_BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        run: python scripts/validate.py --candidate dist --seal --baseline-commit "$STABLE_BASELINE_COMMIT"
      - name: Save validation summary
        if: always()
        run: |
          if [ -f dist/VALIDATION.md ]; then cat dist/VALIDATION.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: generated
      - name: Publish candidate only
        run: |
          python scripts/publish_candidate.py --candidate generated --apply > publication.json
          cat publication.json
          python scripts/check_remote.py --publication publication.json --candidate generated
